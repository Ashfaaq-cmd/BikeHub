<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeHub — Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar"><div class="container">
    <a href="index.html" class="nav-logo">Bike<span>Hub</span></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li class="nav-dropdown"><a href="products.html">Products <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></a>
            <div class="dropdown-menu">
                <a href="products.html?cat=bikes" class="dropdown-item"><div class="dropdown-icon"><svg viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/></svg></div>Road Bikes</a>
                <a href="products.html?cat=gears" class="dropdown-item"><div class="dropdown-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg></div>Gear Sets</a>
                <a href="products.html" class="dropdown-item"><div class="dropdown-icon"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/></svg></div>All Products</a>
            </div>
        </li>
        <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-right"><a href="account.html" class="btn-nav-blue">Account</a></div>
</div></nav>

<div class="cart-page">
    <div class="container">
        <div class="cart-layout">
            <!-- LEFT: Cart Items -->
            <div>
                <div class="cart-heading">Your Cart <span class="cart-count-lbl" id="cart-item-count">(0 items)</span></div>
                <!-- JS renders cart items here — HIM: replace with PHP $_SESSION cart -->
                <div class="cart-items-list" id="cart-items-list">
                    <!-- JS fills this -->
                </div>
                <a href="products.html" class="continue-link">← Continue Shopping</a>
            </div>

            <!-- RIGHT: Order Summary -->
            <div class="order-summary">
                <div class="summary-title">Order Summary</div>
                <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
                <div class="summary-row"><span>Shipping</span><span id="summary-shipping" class="free-txt">Free</span></div>
                <div class="summary-row"><span>Tax (8%)</span><span id="summary-tax">$0.00</span></div>
                <div class="summary-div"></div>
                <div class="summary-row total"><span>Total</span><span id="summary-total">$0.00</span></div>
                <div class="promo-row">
                    <input class="promo-input" type="text" placeholder="Promo code...">
                    <button class="promo-apply">Apply</button>
                </div>
                <a href="login.html" class="checkout-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Secure Checkout
                </a>
                <div class="ssl-note">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    SSL encrypted · Safe checkout
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
